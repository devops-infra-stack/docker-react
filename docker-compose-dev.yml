version: '3'
services:
  web: # this container is solely responsible for running our web application
    build:
      context: . # from where all the files and folder to be pulled from
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - .:/app
  tests: # this conrainer is solenly responsible for running our test
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - .:/app
    command: ["npm", "run", "test"]